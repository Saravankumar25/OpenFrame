[package]
name = "openframe-ai"
description = "OpenFrame Offline AI: the engine bundled with the app (pinned lock), the models downloaded after install (signed manifest, resume, check, activation), the integrity check before the first start, hardware inspection, managed llama.cpp engine supervisor and local loopback chat client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openframe-domain.workspace = true
openframe-security.workspace = true
openframe-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sysinfo.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[features]
# Development tools and tests only: install the pinned models from the build inputs as a finished
# download would (test_support.rs). Never enabled by the desktop app.
test-support = []

[dev-dependencies]
tempfile.workspace = true
# The real-model test installs the pinned models with test_support.
openframe-ai = { path = ".", features = ["test-support"] }

# The bundle test doubles as a fake `llama-server` (it is pinned in a test lock as the bundled
# engine and launched by the real supervisor), so it needs its own `main`.
[[test]]
name = "bundled"
harness = false
