[package]
name = "openframe-gold-project"
description = "Builds, exports and verifies the gold reference film project (tests/gold-project) through the same core operations the app calls."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openframe-domain.workspace = true
openframe-application.workspace = true
openframe-import-export.workspace = true
