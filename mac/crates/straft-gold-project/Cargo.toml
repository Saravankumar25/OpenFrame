[package]
name = "straft-gold-project"
description = "Builds, exports and verifies the gold reference film project (tests/gold-project) through the same core operations the app calls."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p straft-gold-project` keeps building the gold reference project.
default-run = "straft-gold-project"

[dependencies]
straft-domain.workspace = true
straft-application.workspace = true
straft-import-export.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true
zip.workspace = true
image.workspace = true
