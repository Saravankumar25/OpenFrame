[package]
name = "straft-ffi"
description = "The Rust core as a Swift library for the SwiftUI Mac shell (UniFFI, ADR-0027)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
name = "straft_ffi"
# staticlib: linked into the Mac app through the XCFramework. lib: Rust tests and the bindgen tool.
crate-type = ["lib", "staticlib"]

[[bin]]
# Generates the Swift bindings from the compiled library (apps/macos/scripts/build-core.sh).
# A development tool only; never linked into the app.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
# Prints the operation inventory as JSON for scripts/gen-swift-types.mjs. Development tool only.
name = "op-inventory"
path = "src/bin/op-inventory.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
straft-domain.workspace = true
straft-application.workspace = true
straft-security.workspace = true
straft-platform.workspace = true
straft-entitlement.workspace = true
uniffi = "0.32.2"
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
parking_lot.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
