[package]
name = "straft-ai-eval"
description = "Straft AI evaluation harness: runs the gold cases through the real assistant pipeline and scores them with deterministic checks (ADR-0028 decision 1; Windows phase W5). Development only; never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ai-eval"
path = "src/main.rs"

[dependencies]
straft-application.workspace = true
straft-domain.workspace = true
straft-ai = { workspace = true, features = ["test-support"] }
straft-ai-checks = { path = "../straft-ai-checks" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
