[package]
name = "straft-desktop"
description = "Straft Studio desktop application (Tauri adapter)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "straft-desktop"

[lib]
name = "straft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
straft-domain.workspace = true
straft-application.workspace = true
straft-security.workspace = true
straft-entitlement.workspace = true
straft-platform.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true
