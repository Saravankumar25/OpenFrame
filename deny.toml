# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run: cargo deny check            (CI: blocking "supply-chain" job since 2026-10-05, M0.21; release: blocking)
#
# Policy (CONTRIBUTING.md "Dependency policy"):
#   * shipped dependencies must use permissive licenses;
#   * weak-copyleft crates are allowed only as explicit, reviewed per-crate exceptions;
#   * copyleft (GPL/AGPL/LGPL/SSPL/EUPL...) and unknown licenses are rejected;
#   * crates only from crates.io; no git dependencies without review;
#   * RustSec advisories fail the check unless explicitly ignored here with a reason.

[graph]
# Release targets (ADR-0017): Windows 11 on x64 and Apple silicon Macs.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# Every ignored advisory needs: id, reason, and a tracking issue/ADR reference.
ignore = [
    # Owner decision 2026-10-08: dated exception, review by 2027-01-06. Both crates shape and read the
    # bundled Open Font Licence fonts for PDF export (ADR-0016). They parse only fonts that ship inside the
    # app and are pinned by SHA-256 in fonts/fonts.json, never user files. Tracked by the masterplan area 6
    # box "Maintained font shaping crates".
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; parses only bundled, hash-pinned fonts; review by 2027-01-06" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; parses only bundled, hash-pinned fonts; review by 2027-01-06" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# Reviewed weak-copyleft exceptions. MPL-2.0 is file-level copyleft: using the
# unmodified crate is compatible with any OpenFrame license choice; modifying its
# source files would require publishing those modifications under MPL-2.0.
# These come in transitively through Tauri (HTML/CSS processing) and `directories`.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # UniFFI, the Swift interface generator ADR-0027 names for the Mac shell (openframe-ffi).
    # Used unmodified; uniffi_bindgen and its template crates are a development tool only.
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]

# First-party crates are `publish = false` and carry the placeholder
# `LicenseRef-OpenFrame-Pending` until a license is selected (LICENSE-PENDING.md).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # TLS is rustls-only (reqwest `rustls-tls`); no system OpenSSL on Windows.
    { crate = "openssl-sys", reason = "OpenFrame uses rustls; OpenSSL is not shipped." },
    { crate = "native-tls", reason = "OpenFrame uses rustls; see deny.toml." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
