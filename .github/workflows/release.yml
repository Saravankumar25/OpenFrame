# OpenFrame Studio: release build (docs/engineering/24-windows-packaging-updater.md, 25-ci-cd.md).
#
# Triggered by a version tag (vX.Y.Z). FAILS CLOSED: nothing is built unless
# scripts/release-validate.mjs passes (license selected, versions consistent,
# signing material present, updater configured, license inventory clean).
#
# Required repository secrets (never committed; *.pfx/*.p12/*.key are gitignored):
#   WINDOWS_CERTIFICATE                 base64-encoded Authenticode .pfx
#   WINDOWS_CERTIFICATE_PASSWORD        password for the .pfx
#   TAURI_SIGNING_PRIVATE_KEY           Tauri updater signing key (minisign), content or path
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password for the updater key
#   OPENFRAME_TEAM_PASSWORD             team password of the internal build (ADR-0024); build.rs embeds
#                                       only its Argon2id hash, and the build fails without it
# Required repository variables:
#   WINDOWS_TIMESTAMP_URL               RFC 3161 timestamp server of the chosen CA
#   OPENFRAME_AI_ASSETS_DIR             folder on the runner holding the pinned Offline AI build inputs
#                                       (packaging/ai/ai-assets.lock.json, never in git): the engine,
#                                       packaged in every release file, and the models, which the
#                                       end-to-end suite serves from its local test host (ADR-0026).
#                                       Until the runners get these files, release validation and every
#                                       package build fail closed.
#   MODEL_DISTRIBUTION_BASE_URL         the owner's https model host (ADR-0026 decision 8)
#   OPENFRAME_MANIFEST_PUBLIC_KEY       public half of the owner's offline manifest key (base64); a
#                                       release build fails without both (apps/desktop/src-tauri/build.rs)
#
# Microsoft Store channel (jobs validate-store / store, docs/engineering/27-microsoft-store.md).
# Needs NO signing secret: Microsoft signs the MSIX during Store ingestion. Identity values are
# public and may live in packaging/msix/store.config.json instead of these variables:
#   MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME   Partner Center > Product identity
#   STORE_PRIVACY_POLICY_URL                                          hosted docs/store/privacy-policy.md
#   RELEASE_CHANNELS   which channels a tag builds: "direct,store" (default), "direct" or "store"

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (vX.Y.Z)"
        required: true
      channels:
        description: "Channels to build: direct,store | direct | store (default: RELEASE_CHANNELS or both)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # .cargo/config.toml compiles through sccache, which runners do not have; an empty value turns it off.
  RUSTC_WRAPPER: ""
  # Release builds keep the Microsoft linker so the binary hardening flags apply; .cargo/config.toml
  # uses rust-lld for dev and test builds only.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: "20"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Release gate (fail closed)
    if: contains(github.event.inputs.channels || vars.RELEASE_CHANNELS || 'direct,store', 'direct')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-05
        with:
          toolchain: "1.98.1"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release prerequisites
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          OPENFRAME_AI_ASSETS_DIR: ${{ vars.OPENFRAME_AI_ASSETS_DIR }}
        run: node scripts/release-validate.mjs --tag "${{ env.RELEASE_TAG }}"

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo deny (blocking for releases)
        run: cargo deny --locked check

  # Desktop E2E on the exact tagged source is a release gate for both channels (build plan item end-to-end tests in CI).
  e2e:
    name: Desktop E2E on the release tag (gate)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-05
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-e2e

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      # Builds the real app (debug, embedded UI), installs msedgedriver matching the runner's
      # WebView2 and tauri-driver, then runs every spec in tests/e2e/specs: the lifecycle journey,
      # the relaunch check and the reachability test generated from the feature status file.
      # The test build carries the Offline AI engine (build-app.mjs runs prepare-ai-assets.mjs) and is
      # compiled with the suite's local model host and a throwaway test key; the host serves the
      # models from the build inputs (ADR-0026). The gate fails closed until OPENFRAME_AI_ASSETS_DIR
      # provides the pinned files.
      - name: Desktop E2E (tauri-driver + WebView2)
        env:
          OPENFRAME_AI_ASSETS_DIR: ${{ vars.OPENFRAME_AI_ASSETS_DIR }}
        run: npm run test:e2e

      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  build:
    name: Build, sign and package (Windows x64)
    needs: [validate, e2e]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write # draft GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-05
        with:
          toolchain: "1.98.1"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Full verification before packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Value '<!doctype html>'
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          npm run typecheck
          npm --workspace apps/desktop run lint
          npm run test:web
          Remove-Item -Recurse -Force apps/desktop/dist

      - name: Import Authenticode certificate
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "openframe-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          if (-not $cert) { Write-Error "Certificate import failed"; exit 1 }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Signing settings are injected at build time (tauri build --config) so no
      # certificate details live in the repository.
      - name: Write release-only Tauri config
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $conf = @{
            bundle = @{
              createUpdaterArtifacts = $true
              windows = @{
                certificateThumbprint = $env:THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                tsp = $true
              }
            }
          }
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "tauri.release.json")

      - name: tauri build (NSIS + MSI, signed, with updater artifacts)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENFRAME_TEAM_PASSWORD: ${{ secrets.OPENFRAME_TEAM_PASSWORD }}
          OPENFRAME_AI_ASSETS_DIR: ${{ vars.OPENFRAME_AI_ASSETS_DIR }}
          MODEL_DISTRIBUTION_BASE_URL: ${{ vars.MODEL_DISTRIBUTION_BASE_URL }}
          OPENFRAME_MANIFEST_PUBLIC_KEY: ${{ vars.OPENFRAME_MANIFEST_PUBLIC_KEY }}
        run: |
          node scripts/prepare-ai-assets.mjs
          npm --workspace apps/desktop run tauri -- build --bundles nsis,msi --config src-tauri/tauri.bundled-ai.conf.json --config "$env:RUNNER_TEMP/tauri.release.json"
          # The engine the installers were made from matches the lock (fail closed).
          node scripts/prepare-ai-assets.mjs --check --source target/release/ai

      - name: Verify Authenticode signatures (fail closed)
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi
          if (-not $files) { Write-Error "No installers were produced"; exit 1 }
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { $bad += $f.Name }
          }
          $app = Get-AuthenticodeSignature target/release/openframe-desktop.exe
          Write-Host "openframe-desktop.exe: $($app.Status)"
          if ($app.Status -ne 'Valid') { $bad += 'openframe-desktop.exe' }
          if ($bad.Count) { Write-Error "Unsigned or invalid: $($bad -join ', ')"; exit 1 }

      - name: Software bill of materials (CycloneDX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --target x86_64-pc-windows-msvc
          Get-ChildItem -Recurse -Filter *.cdx.json -Path apps, crates | ForEach-Object {
            Copy-Item $_.FullName (Join-Path release-assets ("sbom-rust-" + $_.Name))
          }
          npx --yes @cyclonedx/cyclonedx-npm@1.20.0 --omit dev --output-format JSON --output-file release-assets/sbom-npm.cdx.json

      - name: Third-party license inventory
        run: |
          node scripts/license-inventory.mjs --check --out release-assets/THIRD_PARTY_LICENSES.md

      - name: Collect installers, updater artifacts and checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi,*.sig,*.zip |
            ForEach-Object { Copy-Item $_.FullName release-assets/ }
          Push-Location release-assets
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Get-ChildItem release-assets

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openframe-${{ env.RELEASE_TAG }}-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      # A human reviews and publishes the draft. Update manifests (latest.json) are
      # published separately to the update endpoint after that review.
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" --draft --verify-tag --title "OpenFrame Studio $env:RELEASE_TAG" --notes "Draft build. Review installers, signatures, SBOM and notices before publishing." (Get-ChildItem release-assets -File).FullName

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          if ($env:THUMBPRINT) { Remove-Item -Force -ErrorAction SilentlyContinue "Cert:\CurrentUser\My\$env:THUMBPRINT" }

  # ---------------------------------------------------------------------------------------------
  # Microsoft Store channel: MSIX for Partner Center upload. Independent of the direct channel, so
  # it does not need the Authenticode certificate or the updater keys.
  validate-store:
    name: Store release gate (fail closed)
    if: contains(github.event.inputs.channels || vars.RELEASE_CHANNELS || 'direct,store', 'store')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-05
        with:
          toolchain: "1.98.1"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Store release prerequisites
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          STORE_PRIVACY_POLICY_URL: ${{ vars.STORE_PRIVACY_POLICY_URL }}
          OPENFRAME_AI_ASSETS_DIR: ${{ vars.OPENFRAME_AI_ASSETS_DIR }}
        run: node scripts/release-validate.mjs --store --tag "${{ env.RELEASE_TAG }}"

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo deny (blocking for releases)
        run: cargo deny --locked check

  store:
    name: Build Microsoft Store package (MSIX, x64)
    needs: [validate-store, e2e]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-05
        with:
          toolchain: "1.98.1"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Full verification before packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Value '<!doctype html>'
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          npm run typecheck
          npm --workspace apps/desktop run lint
          npm run test:web
          Remove-Item -Recurse -Force apps/desktop/dist

      # OPENFRAME_DISTRIBUTION=store sets cfg(openframe_store): the in-app updater is compiled out
      # and the executable carries the "store" channel marker that build-msix.mjs --store requires.
      - name: tauri build (Store channel, no installer bundles)
        shell: pwsh
        env:
          OPENFRAME_DISTRIBUTION: store
          OPENFRAME_AI_ASSETS_DIR: ${{ vars.OPENFRAME_AI_ASSETS_DIR }}
          MODEL_DISTRIBUTION_BASE_URL: ${{ vars.MODEL_DISTRIBUTION_BASE_URL }}
          OPENFRAME_MANIFEST_PUBLIC_KEY: ${{ vars.OPENFRAME_MANIFEST_PUBLIC_KEY }}
        run: |
          node scripts/prepare-ai-assets.mjs
          npm --workspace apps/desktop run tauri -- build --no-bundle --config src-tauri/tauri.bundled-ai.conf.json -- --locked

      - name: Package MSIX (makeappx; unsigned, Microsoft signs Store packages)
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          OPENFRAME_AI_ASSETS_DIR: ${{ vars.OPENFRAME_AI_ASSETS_DIR }}
        run: node scripts/build-msix.mjs --store

      - name: Collect Store artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force store-assets | Out-Null
          Copy-Item target/msix/*.msix, target/msix/msix-build.json store-assets/
          node scripts/license-inventory.mjs --check --out store-assets/THIRD_PARTY_LICENSES.md
          Push-Location store-assets
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Get-ChildItem store-assets

      # Not attached to the GitHub release: the unsigned MSIX is only for Partner Center upload
      # (Partner Center > Packages). A human submits it; see docs/engineering/27-microsoft-store.md.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openframe-${{ env.RELEASE_TAG }}-msstore-x64
          path: store-assets/
          if-no-files-found: error
          retention-days: 30
