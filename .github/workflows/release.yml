# OpenFrame Studio: Mac App Store release (package file 04, M7). The Windows tree keeps its own
# workflow; this tree builds the Mac app.
#
# Runs on demand only. FAILS CLOSED: nothing is built while a store-only value is a placeholder
# (scripts/check-release-placeholders.mjs), while a secret below is missing, or when the build number
# did not rise. Upload only runs from main; certificates are imported after every step that runs
# project code. Notarization belongs to the internal disk image, not to this path.
#
# Repository secrets, all supplied by the owner (docs/release/mac-store-placeholders.md):
#   MAC_APPLICATION_CERT_P12, MAC_APPLICATION_CERT_PASSWORD   Apple Distribution certificate, base64
#   MAC_INSTALLER_CERT_P12, MAC_INSTALLER_CERT_PASSWORD       Mac Installer Distribution certificate, base64
#   MAC_PROVISIONING_PROFILE_B64                              REPLACE_WITH_PROVISIONING_PROFILE, base64
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8_B64     App Store Connect, Users and Access, Integrations
# Repository variables:
#   MAC_APPLICATION_IDENTITY   REPLACE_WITH_MAC_APPLICATION_IDENTITY, the certificate's name
#   MAC_INSTALLER_IDENTITY     REPLACE_WITH_MAC_INSTALLER_IDENTITY, the certificate's name

name: Mac App Store release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect after validating"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mac-store-release
  cancel-in-progress: false

jobs:
  store-package:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Placeholders and governance gates
        run: |
          node scripts/check-release-placeholders.mjs --mac
          node scripts/check-writing-standard.mjs
          node scripts/check-migrations.mjs
          node scripts/architecture-lint.mjs
          node scripts/check-secrets.mjs
          node scripts/check-links.mjs
          node --test scripts/tests/store-identity.test.mjs

      - name: Fail when a secret is missing
        env:
          MAC_APPLICATION_IDENTITY: ${{ vars.MAC_APPLICATION_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ vars.MAC_INSTALLER_IDENTITY }}
          APP_P12: ${{ secrets.MAC_APPLICATION_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE_B64 }}
        run: |
          for v in MAC_APPLICATION_IDENTITY MAC_INSTALLER_IDENTITY APP_P12 INSTALLER_P12 PROFILE; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set"; exit 1; }
          done

      - name: Fetch the AI engine into the bundle inputs
        run: packaging/ai/fetch-macos-runtime.sh

      - name: Build the core interface
        run: apps/macos/scripts/build-core.sh release

      - name: Tests
        run: apps/macos/scripts/test.sh

      - name: Import certificates into a temporary keychain
        env:
          APP_P12: ${{ secrets.MAC_APPLICATION_CERT_P12 }}
          APP_PASSWORD: ${{ secrets.MAC_APPLICATION_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$APP_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/store.provisionprofile"

      - name: Build, sign and package
        env:
          MAC_APPLICATION_IDENTITY: ${{ vars.MAC_APPLICATION_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ vars.MAC_INSTALLER_IDENTITY }}
        run: MAC_PROVISIONING_PROFILE="$RUNNER_TEMP/store.provisionprofile" apps/macos/scripts/build-release-app.sh --store

      - name: Validate, and upload when asked
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          PKG="release-out/mac-store/OpenFrame-Studio.pkg"
          xcrun altool --validate-app -f "$PKG" -t macos --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          if [[ "$UPLOAD" == "true" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            xcrun altool --upload-app -f "$PKG" -t macos --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: OpenFrame-Studio-pkg
          path: release-out/mac-store/OpenFrame-Studio.pkg
          retention-days: 14

      - name: Remove the temporary keychain and every secret left on disk
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/store.provisionprofile"
          rm -rf "$HOME/.appstoreconnect/private_keys"
