# OpenFrame Studio: Mac build check (docs/engineering/25-ci-cd.md, docs/engineering/37-platform-boundary.md).
#
# Compiles the macOS desktop shell on Apple silicon: the Swift StoreKit 2 bridge, the Rust code
# behind cfg(target_os = "macos") (platform/macos_storekit.rs, mac_inputs.rs, the revalidation
# worker) and its link against the bridge, and runs the platform and entitlement crate tests on
# macOS. It does not sign, package or run the app, and it never talks to StoreKit or the App Store.
#
# macOS runner minutes cost ten times Windows minutes, so this workflow runs only when a path that
# can change the Mac build changes, plus on demand.

name: Mac build check

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - "crates/openframe-platform/**"
      - "crates/openframe-entitlement/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - "crates/openframe-platform/**"
      - "crates/openframe-entitlement/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # .cargo/config.toml compiles through sccache, which runners do not have; an empty value turns it off.
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  mac-build:
    name: Mac build check (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust (1.98.1, aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-05
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mac-build

      - name: Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version

      # What build.rs runs (there into OUT_DIR), on its own first so a Swift error reads plainly.
      - name: Build the StoreKit bridge (Swift)
        run: swift build -c release --product StoreKitBridge --package-path apps/desktop/src-tauri/macos/StoreKitBridge

      # tauri::generate_context!() requires the configured frontendDist to exist at compile time.
      - name: Placeholder frontend bundle for Rust compilation
        run: |
          mkdir -p apps/desktop/dist
          printf '<!doctype html><title>OpenFrame</title>\n' > apps/desktop/dist/index.html

      - name: cargo check (desktop shell, macOS)
        run: cargo check -p openframe-desktop --target aarch64-apple-darwin --locked

      - name: cargo test (platform and entitlement crates, macOS)
        run: cargo test -p openframe-platform -p openframe-entitlement --target aarch64-apple-darwin --locked

      # cargo check does not link. The desktop unit tests link a binary against the Swift bridge,
      # the StoreKit and Foundation frameworks and the Swift runtime, then run the StoreKit JSON
      # and revalidation tests on macOS.
      - name: cargo test (desktop shell unit tests, links the bridge)
        run: cargo test -p openframe-desktop --lib --target aarch64-apple-darwin --locked
