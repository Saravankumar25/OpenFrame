[package]
name = "openframe-import-export"
description = "Screenplay interchange (Fountain, FDX, DOCX, TXT, PDF import/export) and a generic report document API (PDF, CSV, XLSX). Pure library: no database access."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openframe-domain.workspace = true
openframe-security.workspace = true
openframe-platform.workspace = true
serde.workspace = true
quick-xml.workspace = true
lopdf.workspace = true
flate2.workspace = true
pdf-writer.workspace = true
csv.workspace = true
rust_xlsxwriter.workspace = true
regex.workspace = true
zip.workspace = true
image.workspace = true
rustybuzz.workspace = true
subsetter.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

# Golden PDF image compare (tests/pdf_golden.rs, M1.16): rasterizes exported PDFs with the
# Windows built-in WinRT PDF renderer (Windows.Data.Pdf). Same `windows` 0.61 already locked for
# openframe-ai; only the WinRT features below are added, and only for tests.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "UI",
] }
