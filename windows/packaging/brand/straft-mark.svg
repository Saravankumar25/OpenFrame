<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 24 24" role="img" aria-label="Straft Studio mark">
  <!-- The Straft Studio film-frame mark alone, on a transparent background. Same geometry and
       gradient as apps/desktop/src-tauri/icons/source.svg. -->
  <defs>
    <linearGradient id="straft-mark-gradient" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
      <stop offset="0" stop-color="#ff5d6c"/>
      <stop offset="0.55" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#straft-mark-gradient)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="2.2"/>
    <line x1="7" y1="2" x2="7" y2="22"/>
    <line x1="17" y1="2" x2="17" y2="22"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <line x1="2" y1="7" x2="7" y2="7"/>
    <line x1="2" y1="17" x2="7" y2="17"/>
    <line x1="22" y1="7" x2="17" y2="7"/>
    <line x1="22" y1="17" x2="17" y2="17"/>
  </g>
</svg>
