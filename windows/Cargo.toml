[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/straft-domain",
    "crates/straft-persistence",
    "crates/straft-security",
    "crates/straft-platform",
    "crates/straft-entitlement",
    "crates/straft-project-format",
    "crates/straft-import-export",
    "crates/straft-ai",
    "crates/straft-search",
    "crates/straft-application",
    "crates/straft-ai-checks",
    "crates/straft-ai-eval",
    "crates/straft-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# The final open-source license identifier has not been selected yet (see LICENSE-PENDING.md).
license = "LicenseRef-Straft-Pending"
publish = false
authors = ["Straft Studio contributors"]

[workspace.dependencies]
straft-domain = { path = "crates/straft-domain" }
straft-persistence = { path = "crates/straft-persistence" }
straft-project-format = { path = "crates/straft-project-format" }
straft-security = { path = "crates/straft-security" }
straft-platform = { path = "crates/straft-platform" }
straft-entitlement = { path = "crates/straft-entitlement" }
straft-search = { path = "crates/straft-search" }
straft-import-export = { path = "crates/straft-import-export" }
straft-ai = { path = "crates/straft-ai" }
straft-application = { path = "crates/straft-application" }
straft-test-support = { path = "crates/straft-test-support" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions", "serde_json", "limits"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
ts-rs = { version = "11", features = ["serde-json-impl", "uuid-impl"] }
parking_lot = "0.12"
tempfile = "3"
fs4 = { version = "0.13", features = ["sync"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
regex = "1"
similar = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
sysinfo = "0.37"
csv = "1"
rust_xlsxwriter = "0.100"
pdf-writer = "0.13"
lopdf = "0.45"
# Already in the tree via lopdf; used directly to inflate PDF streams with hard caps.
flate2 = "1"
unicode-segmentation = "1"
# Screenplay PDF fonts (ADR-0016): complex-script shaping and deterministic font subsetting.
# rustybuzz is a pure-Rust HarfBuzz port (MIT); subsetter is the Typst subsetter (MIT OR Apache-2.0).
rustybuzz = "0.20"
subsetter = { version = "0.2", default-features = false }
anyhow = "1"
# Vector KNN for the derived intelligence index, compiled into the binary (SQLITE_CORE; no
# runtime extension loading). MIT OR Apache-2.0.
sqlite-vec = "0.1.9"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

# `npm run perf`: optimised like release (same opt-level), but without LTO and
# with parallel codegen so the performance suite builds in minutes.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
