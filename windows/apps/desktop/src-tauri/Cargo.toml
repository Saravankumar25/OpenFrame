[package]
name = "straft-desktop"
description = "Straft Studio desktop application (Tauri adapter)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "straft-desktop"

[lib]
name = "straft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Internal builds only (ADR-0024): Argon2id hash of STRAFT_TEAM_PASSWORD with a random salt.
argon2.workspace = true
getrandom.workspace = true

[dependencies]
straft-domain.workspace = true
straft-application.workspace = true
straft-security.workspace = true
straft-entitlement.workspace = true
straft-platform.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
parking_lot.workspace = true

# The Microsoft Store calls (platform/microsoft_store.rs): Windows.Services.Store over WinRT, the
# window handle for the purchase dialog, and the local clock for the midnight check. The same
# major version as crates/straft-platform, so the build tree holds one copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Services_Store",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true
