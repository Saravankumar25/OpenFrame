[package]
name = "openframe-desktop"
description = "OpenFrame Studio desktop application (Tauri adapter)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "openframe-desktop"

[lib]
name = "openframe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openframe-domain.workspace = true
openframe-application.workspace = true
openframe-security.workspace = true
openframe-entitlement.workspace = true
openframe-platform.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true
