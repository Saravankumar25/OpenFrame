[package]
name = "openframe-ai"
description = "OpenFrame Offline AI: the AI bundled with the app (pinned lock, integrity check before the first start), hardware inspection, managed llama.cpp engine supervisor and local loopback chat client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openframe-domain.workspace = true
openframe-security.workspace = true
openframe-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sysinfo.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The bundle test doubles as a fake `llama-server` (it is pinned in a test lock as the bundled
# engine and launched by the real supervisor), so it needs its own `main`.
[[test]]
name = "bundled"
harness = false
