[package]
name = "openframe-ai"
description = "OpenFrame Offline AI: hardware inspection, signed model manifest, verified resumable model/runtime installation, managed llama.cpp sidecar supervisor and local chat client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openframe-domain.workspace = true
openframe-security.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sysinfo.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
fs4.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# DXGI adapter enumeration (GPU name + dedicated VRAM) and Job Objects (no orphan sidecars).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
