[package]
name = "openframe-platform"
description = "Platform boundary: the one place that knows which operating system OpenFrame runs on. App folders, atomic file replace, fast existence checks, managed child processes, package identity, keyboard labels and operating system spelling dictionaries, with a Windows adapter and a macOS adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
rand.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Job Objects (no orphan child processes) and the handle types they need; the Windows Spell
# Checking API (operating system dictionaries for proofing) and the COM calls it needs.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
